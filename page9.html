<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据集 — 第 9 页</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>table.dataTable{width:100% !important;} .container{max-width:1200px;}</style>
  </head>
  <body>
    <div class="container py-3">
      <h2>数据集 — 第 9 页</h2>
      <p>每页显示全部数据的 1/20（客户端切片）。</p>
      <div id="table-container">正在加载数据……</div>
      <div class="mt-3">
        <a class="btn btn-sm btn-outline-primary" href="index.html">返回目录</a>
        <a class="btn btn-sm btn-outline-secondary" id="prevBtn">上一页</a>
        <a class="btn btn-sm btn-outline-secondary" id="nextBtn">下一页</a>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="data.js"></script>
    <script>
      const PAGE_NUM = 9;
      const TOTAL_PAGES = 10;

      function renderPage() {
        const parsed = Papa.parse(CSV_DATA, {header: true, skipEmptyLines: true});
        const rows = parsed.data; // array of objects
        const totalRows = rows.length;
        const rowsPerPage = Math.ceil(totalRows / TOTAL_PAGES) || totalRows;
        const start = (PAGE_NUM - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, totalRows);
        const slice = rows.slice(start, end);

        if (slice.length === 0) {
          document.getElementById('table-container').innerHTML = '<div class="alert alert-warning">这一页没有数据。</div>';
          return;
        }

        // Build table
        let html = '<table id="dt" class="display table table-bordered table-sm"><thead><tr>';
        const columns = Object.keys(slice[0]);
        for (const col of columns) html += '<th>' + col + '</th>';
        html += '</tr></thead><tbody>';
        for (const r of slice) {
          html += '<tr>';
          for (const col of columns) html += '<td>' + (r[col] === undefined ? '' : r[col]) + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';

        document.getElementById('table-container').innerHTML = html;
        $('#dt').DataTable({pageLength: 25, searching: true, lengthChange: false});

        // prev/next
        const prev = Math.max(1, PAGE_NUM - 1);
        const next = Math.min(TOTAL_PAGES, PAGE_NUM + 1);
        document.getElementById('prevBtn').href = 'page' + prev + '.html';
        document.getElementById('nextBtn').href = 'page' + next + '.html';
      }

      document.addEventListener('DOMContentLoaded', renderPage);
    </script>
  </body>
</html>
